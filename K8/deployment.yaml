apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: kirand18/project-repository:1
        imagePullPolicy: Always
        ports:
        - containerPort: 3005  # container Port 
        env:
        - name: MONGO_URI
          value: "mongodb+srv://admin:Nagesh7997@cluster0.45avcop.mongodb.net/hrms_staging?retryWrites=true&w=majority&appName=Cluster0"
